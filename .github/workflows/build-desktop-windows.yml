name: Build Desktop (Windows, unsigned)

on:
  workflow_dispatch:
  push:
    branches: [desktop-win-build]

jobs:
  package-win-x64:
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - name: Enable long paths
        shell: pwsh
        run: git config --system core.longpaths true

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Enable Developer Mode (symlink support)
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      # Unsigned local build: no signing, no auto-update feed.
      # The mandatory-update policy origin is required by the packager; an .invalid
      # origin never resolves, so the app's policy check just fails and backs off.
      - name: Write .env.windows
        shell: pwsh
        run: |
          @(
            'DSH_DESKTOP_APP_ID=com.deepseek.harness'
            'DSH_DESKTOP_AUTO_UPDATE_ENV=production'
            'DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://mandatory-update.invalid'
          ) | Set-Content -Encoding utf8 apps/desktop/.env.windows

      - name: Package unsigned installer
        shell: pwsh
        env:
          PYTHON: ${{ env.pythonLocation }}\python.exe
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-win-x64-unsigned
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: error
          compression-level: 0

      - name: Upload packaging logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-logs
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: ignore
